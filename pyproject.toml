[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-agent"
version = "0.1.0"
description = "Claude-powered cyber threat intelligence agent: give it an IOC or a threat report and it investigates automatically."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cti-agent = "cti_agent.cli:main"

[tool.setuptools.packages.find]
include = ["cti_agent*"]
